name: Julia Kochstudio auf STRATO
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: julia-kochstudio-strato
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Statische Website erstellen
        run: |
          npm ci
          npm run build
          node --check dist/kochbuch.js
      - name: Fertige Website zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Julia-Kochstudio-STRATO
          path: dist/
      - name: SFTP-Werkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Website-Dateien übertragen
        env:
          STRATO_SFTP_HOST: ${{ vars.STRATO_SFTP_HOST }}
          STRATO_SFTP_USER: ${{ vars.STRATO_SFTP_USER }}
          STRATO_SFTP_TARGET: ${{ vars.STRATO_SFTP_TARGET }}
          STRATO_SFTP_KNOWN_HOSTS: ${{ vars.STRATO_SFTP_KNOWN_HOSTS }}
          STRATO_SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: bash scripts/deploy.sh
